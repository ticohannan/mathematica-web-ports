# Machine-readable licence map (REUSE specification, https://reuse.software/).
# Source files carry their own SPDX header; these rules cover files that cannot
# (JSON, Markdown, images) and act as the default for each folder.
# "closest" = a file's own header wins over these rules.
# Human-readable summary: LICENSE.md, "Which licence applies to which file".
version = 1

# Separable tooling, shared helpers and generic docs: MIT
[[annotations]]
path = ["tools/**", "shared/**", "LICENSES/**", "REUSE.toml", ".gitignore", ".gitattributes", ".nojekyll",
        "package.json", "package-lock.json", "vitest.config.js", "playwright.config.js",
        "docs/ARCHITECTURE.md", "docs/TESTING.md", "docs/DESIGN_PROCESS.md"]
precedence = "closest"
SPDX-FileCopyrightText = "2026 Tico Hannan"
SPDX-License-Identifier = "MIT"

# Everything adapted from, or derived from, the Wolfram Demonstrations: CC BY-NC-SA 3.0
[[annotations]]
path = ["demos/**", "index.html", "README.md", "LICENSE.md", "tests/**",
        "docs/original-source/**", "docs/original-snapshots/**", "docs/MANUAL_TEST_CHECKLIST.md", "docs/checklists/**"]
precedence = "closest"
SPDX-FileCopyrightText = ["2026 Tico Hannan", "Original Wolfram Demonstrations by their authors, see LICENSE.md"]
SPDX-License-Identifier = "CC-BY-NC-SA-3.0"

# Mathematica-harness scenario files (test inputs written for this project) and the generic harness test helpers: MIT.
# Listed after the CC BY-NC-SA rule for tests/** so that they take precedence (the last matching annotation wins).
[[annotations]]
path = ["tests/harness/**", "tests/support/harness-json.js", "tests/unit/harness-*.test.js", "tests/unit/fixtures/fake-wolframscript.mjs"]
precedence = "closest"
SPDX-FileCopyrightText = "2026 Tico Hannan"
SPDX-License-Identifier = "MIT"

# prm-3d's scenario file also carries "definitions" copied from the original notebook's Input cells; the
# motion-planning parity scenarios carry coordinates copied from the CC BY-NC-SA golden fixture
[[annotations]]
path = ["tests/harness/prm-3d.scenarios.json", "tests/harness/motion-planning.scenarios.json"]
precedence = "override"
SPDX-FileCopyrightText = ["2026 Tico Hannan", "Original Wolfram Demonstration by its authors, see LICENSE.md"]
SPDX-License-Identifier = "MIT AND CC-BY-NC-SA-3.0"

# Third-party: three.js
[[annotations]]
path = "vendor/three/**"
precedence = "closest"
SPDX-FileCopyrightText = "2010-2026 three.js authors"
SPDX-License-Identifier = "MIT"

# Upstream licence notice kept for the car-path port (code converted by the original's authors from this library)
[[annotations]]
path = "docs/third-party/reeds-shepp-curves-LICENSE.txt"
precedence = "override"
SPDX-FileCopyrightText = "2019 Nathan Lichtlé"
SPDX-License-Identifier = "MIT"
